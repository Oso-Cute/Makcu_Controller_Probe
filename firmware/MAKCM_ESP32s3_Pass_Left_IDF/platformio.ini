; LEFT MCU — USB device (plugs into target PC). ESP-IDF + TinyUSB.
; Two builds are produced from this same source by toggling COM3_LOG /
; KM_DIAG / KM_RING / LAT_DIAG via -D flags:
;   - Log:   defaults in source (verbose UART0 diag output)
;   - Quiet: -DCOM3_LOG=0 -DKM_DIAG=0 -DKM_RING=0 -DLAT_DIAG=0

[env:LEFT_IDF]
platform          = espressif32 @ 6.7.0
board             = MAKCM
framework         = espidf
board_build.partitions = partitions/partition_MAKCM.csv

build_flags =
  -DFIRMWARE_VERSION=\"V1_2_Pass_IDF\"
  -DCOM3_LOG=0
  ; Route TinyUSB's temporary level-2 enumeration trace through the
  ; existing 4 Mbps UART0 diagnostic path (the ESP console is disabled).
  -DCFG_TUSB_DEBUG_PRINTF=pass_tusb_debug_printf
  ; Xbox qualifier quirk: wrap TinyUSB's low-level stall call so this one
  ; failed IN descriptor request stalls EP0 IN without also wedging EP0 OUT.
  -Wl,--wrap=dcd_edpt_stall
  ; Mirror the real device's Microsoft OS 1.0 string descriptor at index EE;
  ; all normal string indices continue through esp_tinyusb unchanged.
  -Wl,--wrap=tud_descriptor_string_cb
  ; XIM-fit gain curve constants live in km_inject.c (KM_GAIN_C, KM_GAIN_P).
  ; Override with -D here only when re-tuning.

; Shareable controller-fingerprinting build. This keeps LEFT_IDF unchanged
; while enabling structured, bounded probe records on the CH343 UART.
[env:LEFT_PROBE]
extends = env:LEFT_IDF
build_unflags =
  -DCOM3_LOG=0
build_flags =
  ${env:LEFT_IDF.build_flags}
  -DCOM3_LOG=1
  -DPROBE_MODE=1
  -DKM_DIAG=0
  -DKM_RING=0
  -DLAT_DIAG=0
